<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programm-Indikatoren · Varianten</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #f4f4f2;
      --card: #ffffff;
      --ink: #111111;
      --muted: #6b6b6b;
      --line: #e2e2df;
      --soft: #f0f0ee;
      --selected: #8b5cb8;
      --dot-size: 6px;
      --stack-step: calc(var(--dot-size) / 2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 44px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(25px, 4vw, 38px);
      line-height: 1.05;
      letter-spacing: -0.025em;
    }

    header p {
      max-width: 700px;
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .state-button {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .is-scrubbing .state-button {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--card);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .variant {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }

    .variant-head {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .variant-head p,
    .variant-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .app {
      padding: 18px;
    }

    .programs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .prog {
      position: relative;
      min-width: 0;
      min-height: 68px;
      padding: 10px 8px 8px;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
    }

    .prog[data-selected] {
      border-color: var(--ink);
      background: var(--soft);
    }

    .prog-name {
      display: block;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .prog-number {
      color: var(--muted);
    }

    .timeline-wrap {
      padding: 31px 3px 22px;
    }

    .timeline-label {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .timeline {
      position: relative;
      height: 2px;
      background: var(--line);
    }

    .wish {
      position: absolute;
      left: 67%;
      top: 50%;
      width: 2px;
      height: 18px;
      border-radius: 2px;
      background: var(--ink);
      transform: translate(-50%, -50%);
    }

    .single-dot {
      position: absolute;
      left: 24%;
      top: 50%;
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: #3d9a4a;
      box-shadow: 0 0 0 1.5px var(--card);
      transform: translate(-50%, -50%);
    }

    .timeline-stack {
      position: absolute;
      left: 47%;
      top: 50%;
      width: var(--dot-size);
      height: var(--dot-size);
      transform: translate(-50%, -50%);
    }

    .disc {
      position: absolute;
      inset: 0;
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 1.5px var(--card);
    }

    .disc:nth-child(1) {
      z-index: 3;
      background: var(--selected);
    }

    .disc:nth-child(2) {
      z-index: 2;
      transform: translateY(var(--stack-step));
    }

    .disc:nth-child(3) {
      z-index: 1;
      transform: translateY(calc(var(--stack-step) * 2));
    }

    .variant-note {
      min-height: 68px;
      padding: 0 18px 18px;
    }

    /* A: gefüllter Punkt beziehungsweise Ring in der Ecke */
    .variant-a .prog[data-match]::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      opacity: 0.32;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .variant-a .prog[data-selected]::after {
      background: var(--ink);
      opacity: 0.82;
    }

    /* B: kleine Kerbe an der unteren Kartenkante */
    .variant-b .prog[data-match]::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 15px;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--ink);
      opacity: 0.25;
      transform: translateX(-50%);
      transition: opacity 140ms ease, width 140ms ease;
    }

    .variant-b .prog[data-selected]::after {
      width: 22px;
      opacity: 0.72;
    }

    /* C: Miniatur der Timeline im Footer */
    .match-glyph {
      position: absolute;
      right: 8px;
      bottom: 11px;
      display: none;
      width: 18px;
      height: 7px;
      opacity: 0.3;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .variant-c .prog[data-match] .match-glyph {
      display: block;
    }

    .match-glyph::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 3px;
      height: 1px;
      background: var(--ink);
    }

    .match-glyph::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 7px;
      height: 7px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--card);
      transform: translateX(-50%);
    }

    .variant-c .prog[data-selected] .match-glyph {
      opacity: 0.8;
    }

    .variant-c .prog[data-selected] .match-glyph::after {
      background: var(--ink);
      box-shadow: inset 0 0 0 1.5px var(--soft);
    }

    .is-scrubbing .prog[data-match]::after,
    .is-scrubbing .prog[data-match] .match-glyph {
      opacity: 0.95;
    }

    .is-scrubbing .variant-a .prog[data-match]::after,
    .is-scrubbing .variant-c .prog[data-match] .match-glyph {
      transform: scale(1.12);
    }

    .is-scrubbing .variant-b .prog[data-match]::after {
      width: 22px;
    }

    @media (max-width: 940px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .variant {
        width: min(100%, 430px);
        margin: 0 auto;
      }
    }

    @media (max-width: 560px) {
      header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>Programme derselben Endzeit</h1>
        <p>
          Täglich ist ausgewählt; Sensor und Nacht erreichen dieselbe Endzeit.
          Der Stapel zeigt durch halben Scheibenversatz drei Programme.
        </p>
      </div>
      <button class="state-button" id="stateButton" type="button">Ruhezustand</button>
    </header>

    <section class="grid" id="variants"></section>
  </main>

  <script>
    (() => {
      const VARIANTS = [
        {
          className: 'variant-a',
          title: 'A · Punkt und Ring',
          description: 'Direkt lesbar: gefüllt ist ausgewählt, Ringe sind Alternativen.',
          note: 'Sehr kompakt und unabhängig von der Kartenform. Kann wie ein Statuspunkt wirken.',
        },
        {
          className: 'variant-b',
          title: 'B · Kantenmarkierung',
          description: 'Eine kleine Kerbe verbindet passende Programme visuell.',
          note: 'Am ruhigsten im Ruhezustand, aber weniger eindeutig mit der Timeline verbunden.',
        },
        {
          className: 'variant-c',
          title: 'C · Timeline-Echo',
          description: 'Ein Miniatur-Symbol wiederholt Linie und Scheibe.',
          note: 'Semantisch am deutlichsten, benötigt jedoch etwas mehr Platz im Kartenfooter.',
        },
      ];

      const PROGRAMS = [
        { name: 'Eco', number: '1' },
        { name: 'Sensor', number: '2', match: true },
        { name: 'Täglich', number: '4', match: true, selected: true },
        { name: 'Nacht', number: '5', match: true },
      ];

      function programMarkup(program) {
        return `
          <div class="prog" ${program.match ? 'data-match' : ''} ${program.selected ? 'data-selected' : ''}>
            <span class="prog-name">${program.name}</span>
            <span class="prog-number">${program.number}</span>
            <span class="match-glyph" aria-hidden="true"></span>
          </div>
        `;
      }

      document.getElementById('variants').innerHTML = VARIANTS.map((variant) => `
        <article class="variant ${variant.className}">
          <div class="variant-head">
            <h2>${variant.title}</h2>
            <p>${variant.description}</p>
          </div>
          <div class="app">
            <div class="programs">${PROGRAMS.map(programMarkup).join('')}</div>
            <div class="timeline-wrap">
              <div class="timeline-label">Überblick ± 1 h</div>
              <div class="timeline">
                <span class="single-dot"></span>
                <span class="timeline-stack">
                  <i class="disc"></i>
                  <i class="disc"></i>
                  <i class="disc"></i>
                </span>
                <span class="wish"></span>
              </div>
            </div>
          </div>
          <p class="variant-note">${variant.note}</p>
        </article>
      `).join('');

      const stateButton = document.getElementById('stateButton');
      stateButton.addEventListener('click', () => {
        const active = document.body.classList.toggle('is-scrubbing');
        stateButton.textContent = active ? 'Scrubben aktiv' : 'Ruhezustand';
      });
    })();
  </script>
</body>
</html>
