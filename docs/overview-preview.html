<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Überblick E — gewählt</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      --canvas: #fff; --ink: #111; --muted: #6b6b6b; --line: #e5e5e5; --soft: #f0f0f0; --page: #e8e8e8;
    }
    [data-theme="dark"] {
      --canvas: #0a0a0a; --ink: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; --soft: #1c1c1c; --page: #141414;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", sans-serif;
      background: var(--page);
      color: var(--ink);
      font-size: 16px;
      padding: 28px 20px 48px;
    }
    header {
      max-width: 390px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    button.chip {
      border: 1px solid var(--line); background: var(--soft); color: var(--ink);
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; flex-shrink: 0;
    }
    .label { color: var(--muted); }
    .t-strong { font-weight: 600; }
    .phone {
      width: 390px;
      margin: 0 auto;
      background: var(--canvas);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 20px 36px;
    }

    .overview { margin: 0 0 20px; }
    .overview-title { font-weight: 600; margin-bottom: 16px; }

    /* Caps auf Linienhöhe → Linie dazwischen kürzer, keine End-Ticks */
    .overview-tl {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 24px;
    }
    .overview-cap {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1;
    }
    .overview-track {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 1px;
      background: var(--line);
    }
    .overview-wish {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      margin: -3.5px 0 0 -3.5px;
      border-radius: 50%;
      background: var(--ink);
      z-index: 2;
    }
    .overview-mark {
      position: absolute;
      top: 50%;
      width: 3px;
      height: 3px;
      margin: -1.5px 0 0 -1.5px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.55;
      z-index: 1;
    }
    .overview-mark.is-selected {
      width: 9px;
      height: 9px;
      margin: -4.5px 0 0 -4.5px;
      background: var(--ink);
      opacity: 1;
      box-shadow: 0 0 0 3px var(--canvas), 0 0 0 4px var(--ink);
      z-index: 3;
    }

    .fake-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }
    .fake-time {
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="t-strong">E — gewählt</div>
      <div class="label">Keine End-Ticks · −1 h / +1 h auf Linienhöhe · nur Punkte</div>
    </div>
    <button type="button" class="chip" id="themeToggle">Theme</button>
  </header>

  <div class="phone">
    <div class="overview">
      <div class="overview-title">Überblick</div>
      <div class="overview-tl" id="tl">
        <span class="overview-cap">−1 h</span>
        <div class="overview-track" id="track"></div>
        <span class="overview-cap">+1 h</span>
      </div>
    </div>
    <div class="fake-pair">
      <div class="label">Wunschzeit</div>
      <div class="label">Tatsächlich</div>
      <div class="fake-time">06:30</div>
      <div class="fake-time">06:40</div>
    </div>
  </div>

  <script>
    const WINDOW = 60;
    const MARKS = [
      { offsetMin: -40 },
      { offsetMin: -20 },
      { offsetMin: -10 },
      { offsetMin: 10, selected: true },
      { offsetMin: 20 },
      { offsetMin: 40 },
      { offsetMin: 50 }
    ];
    const track = document.getElementById('track');
    track.innerHTML = '<div class="overview-wish" title="Wunschzeit"></div>';
    for (const m of MARKS) {
      const el = document.createElement('div');
      el.className = 'overview-mark' + (m.selected ? ' is-selected' : '');
      el.style.left = ((m.offsetMin + WINDOW) / (WINDOW * 2)) * 100 + '%';
      track.appendChild(el);
    }

    const root = document.documentElement;
    const saved = localStorage.getItem('dto-overview-preview-theme');
    root.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    document.getElementById('themeToggle').onclick = () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('dto-overview-preview-theme', next);
    };
  </script>
</body>
</html>
